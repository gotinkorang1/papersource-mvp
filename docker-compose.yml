# Dedicated PaperSource database. Do not reuse other project containers.
name: papersource

services:
  postgres:
    image: postgres:16-alpine
    container_name: papersource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: papersource
      POSTGRES_PASSWORD: papersource
      POSTGRES_DB: papersource
    ports:
      - "54329:5432"
    volumes:
      - papersource_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papersource -d papersource"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  papersource_pgdata:
