name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail early when a production dependency regresses into a known
      # moderate-or-higher vulnerability.
      - run: pnpm audit --prod --audit-level=moderate
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # If the repository has the hosted connection secret, fail the release
      # before deployment when critical commerce schema or pickup zones drift.
      - name: Verify hosted commerce schema
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:verify-hosted
      # Keep the deploy artifact itself covered, not just its source checks.
      - run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.papersourcegh.com
      # Keep the jsdom/React suite deterministic on shared GitHub runners.
      - run: pnpm test -- --pool=forks --maxWorkers=1
